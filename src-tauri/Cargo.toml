[package]
name = "forticlient_tray_helper"
version = "0.1.0"
description = "A system tray helper to manage the FortiClient service and GUI on Linux"
authors = ["CodeDead <admin@codedead.com>"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.99.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "forticlient_tray_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
